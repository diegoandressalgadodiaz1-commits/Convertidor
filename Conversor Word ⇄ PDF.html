<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversor Word ⇄ PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx-preview/0.3.3/docx-preview.min.js"></script>
<script>window.DP=window.docx;</script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
<script>window.DL=window.docx;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#5d6675;--ac:#1f6feb;--ac2:#e8f0fe;--bd:#d9dee6;--ok:#157a3d;--er:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#181e26;--tx:#eaeef4;--mu:#9aa5b5;--ac:#5b9bff;--ac2:#1c2a44;--bd:#2b3542;--ok:#4cc77a;--er:#ff7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#181e26;--tx:#eaeef4;--mu:#9aa5b5;--ac:#5b9bff;--ac2:#1c2a44;--bd:#2b3542;--ok:#4cc77a;--er:#ff7b7b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}p.s{color:var(--mu);margin:0 0 16px;font-size:.92rem}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:.88rem;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.drop{display:block;border:2px dashed var(--bd);border-radius:12px;padding:26px 12px;text-align:center;cursor:pointer;color:var(--mu)}
.drop.over{background:var(--ac2);border-color:var(--ac)}.drop b{color:var(--tx);display:block;margin-bottom:4px}
input[type=file]{display:none}
.opt{margin-top:12px;font-size:.9rem}.opt label{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin-top:6px;cursor:pointer}
.opt input{margin-right:8px}
#list{margin:12px 0 0;padding:0;list-style:none;font-size:.88rem;color:var(--mu)}
#go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
#go:disabled{opacity:.5;cursor:default}
#st{margin-top:12px;font-size:.9rem;min-height:1.3em}.ok{color:var(--ok)}.er{color:var(--er)}
.bar{height:6px;background:var(--bd);border-radius:6px;margin-top:10px;overflow:hidden;display:none}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#stage{position:absolute;left:-99999px;top:0;width:1400px;pointer-events:none}
.note{font-size:.8rem;color:var(--mu);margin-top:14px}
</style></head><body><main>
<h1>Conversor Word ⇄ PDF</h1>
<p class="s">Todo ocurre en tu dispositivo: tus archivos no se suben a ningún servidor.</p>
<div class="tabs" id="tabs">
<button data-m="w2p" class="on">Word → PDF</button><button data-m="p2w">PDF → Word</button><button data-m="i2p">Imágenes → PDF</button></div>
<div class="card">
<label class="drop" id="drop"><b id="dt">Toca o arrastra tu archivo .docx</b><span id="dh">Formato idéntico al original</span>
<input type="file" id="f"></label>
<ul id="list"></ul>
<div class="opt" id="opt" style="display:none">
<label><input type="radio" name="pm" value="exact" checked>Formato idéntico (cada página como imagen, no editable)</label>
<label><input type="radio" name="pm" value="edit">Texto editable (el diseño puede variar)</label></div>
<button id="go" disabled>Convertir</button>
<div class="bar" id="bar"><i id="bi"></i></div>
<div id="st"></div></div>
<p class="note">Word → PDF conserva el aspecto exacto de cada página. Para PDF escaneados usa la opción de formato idéntico.</p>
<div id="stage"></div>
<script>
const $=id=>document.getElementById(id);
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const M={w2p:{t:"Toca o arrastra tu archivo .docx",h:"Formato idéntico al original",a:".docx",m:false},
p2w:{t:"Toca o arrastra tu archivo PDF",h:"Elige cómo quieres el Word",a:".pdf,application/pdf",m:false},
i2p:{t:"Toca o arrastra tus imágenes",h:"Varias imágenes = un solo PDF",a:"image/*",m:true}};
let mode="w2p",files=[];
function setMode(m){mode=m;files=[];$("f").value="";$("f").accept=M[m].a;$("f").multiple=M[m].m;
$("dt").textContent=M[m].t;$("dh").textContent=M[m].h;$("opt").style.display=m==="p2w"?"block":"none";
document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));upd();msg("")}
function upd(){$("list").innerHTML=files.map(f=>"<li>• "+f.name.replace(/</g,"&lt;")+" ("+Math.round(f.size/1024)+" KB)</li>").join("");$("go").disabled=!files.length}
function msg(t,c){$("st").textContent=t;$("st").className=c||""}
function prog(p){$("bar").style.display=p==null?"none":"block";$("bi").style.width=(p||0)*100+"%"}
function pick(l){l=[...l];if(!M[mode].m)l=l.slice(0,1);
const okx=mode==="w2p"?/\.docx$/i:mode==="p2w"?/\.pdf$/i:/^image\//;
files=l.filter(f=>okx.test(mode==="i2p"?f.type:f.name));if(!files.length&&l.length)msg("Archivo no válido para esta opción.","er");else msg("");upd()}
$("f").onchange=e=>pick(e.target.files);
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
const dr=$("drop");["dragover","dragenter"].forEach(e=>dr.addEventListener(e,x=>{x.preventDefault();dr.classList.add("over")}));
["dragleave","drop"].forEach(e=>dr.addEventListener(e,x=>{x.preventDefault();dr.classList.remove("over")}));
dr.addEventListener("drop",x=>pick(x.dataTransfer.files));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const base=n=>n.replace(/\.[^.]+$/,"");
async function save(blob,name){
 let d=null;try{d=await claude.use("downloads")}catch(e){}
 if(!d){msg("Tu visor no permite descargas. Abre el enlace del artefacto en el navegador.","er");return}
 try{await d.save({filename:name,data:blob});msg("Listo: "+name,"ok")}
 catch(e){msg(e&&e.code==="declined"?"Descarga cancelada.":"No se pudo guardar el archivo.","er")}}
function blobOf(c,q){return new Promise(r=>c.toBlob(r,"image/jpeg",q))}
async function w2p(f){
 const box=$("stage");box.innerHTML="";
 await DP.renderAsync(await f.arrayBuffer(),box,null,{inWrapper:false,breakPages:true,ignoreLastRenderedPageBreak:false,renderHeaders:true,renderFooters:true,renderFootnotes:true});
 if(document.fonts&&document.fonts.ready)await document.fonts.ready;await wait(400);
 const pg=[...box.querySelectorAll("section.docx")];if(!pg.length)throw Error("vacío");
 let pdf;
 for(let i=0;i<pg.length;i++){
  const p=pg[i],c=await html2canvas(p,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
  const w=p.offsetWidth*.75,h=p.offsetHeight*.75,o=w>h?"l":"p";
  if(!pdf)pdf=new jspdf.jsPDF({unit:"pt",format:[w,h],orientation:o});else pdf.addPage([w,h],o);
  pdf.addImage(c.toDataURL("image/jpeg",.93),"JPEG",0,0,w,h);prog((i+1)/pg.length)}
 box.innerHTML="";return[pdf.output("blob"),base(f.name)+".pdf"]}
async function p2w(f){
 const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
 const exact=document.querySelector("input[name=pm]:checked").value==="exact";
 const secs=[];
 for(let n=1;n<=pdf.numPages;n++){
  const page=await pdf.getPage(n),v1=page.getViewport({scale:1});
  const pr={page:{size:{width:Math.round(v1.width*20),height:Math.round(v1.height*20)},margin:exact?{top:0,bottom:0,left:0,right:0,header:0,footer:0}:{top:720,bottom:720,left:720,right:720}}};
  const kids=[];
  if(exact){
   const v=page.getViewport({scale:2}),cv=document.createElement("canvas");cv.width=v.width;cv.height=v.height;
   await page.render({canvasContext:cv.getContext("2d"),viewport:v}).promise;
   const b=new Uint8Array(await(await blobOf(cv,.93)).arrayBuffer());
   kids.push(new DL.Paragraph({spacing:{before:0,after:0,line:240},children:[new DL.ImageRun({data:b,type:"jpg",transformation:{width:Math.floor(v1.width*4/3)-2,height:Math.floor(v1.height*4/3)-4}})]}));
  }else{
   const tc=await page.getTextContent(),rows=[];
   tc.items.filter(t=>t.str&&t.str.trim()!=="").forEach(t=>{
    const y=t.transform[5],r=rows.find(q=>Math.abs(q.y-y)<3);
    r?r.it.push(t):rows.push({y,it:[t]})});
   rows.sort((a,b)=>b.y-a.y);
   rows.forEach(r=>{r.it.sort((a,b)=>a.transform[4]-b.transform[4]);
    let tx="",px=null;
    r.it.forEach(t=>{const x=t.transform[4];if(px!==null&&x-px>2&&!/\s$/.test(tx))tx+=" ";tx+=t.str;px=x+t.width});
    const t0=r.it[0],sz=Math.max(8,Math.round(Math.abs(t0.transform[3])));
    const ff=(tc.styles[t0.fontName]||{}).fontFamily||"",bold=/bold|black|heavy/i.test(t0.fontName+ff);
    const ind=Math.max(0,Math.round((t0.transform[4]-36)*20));
    kids.push(new DL.Paragraph({spacing:{after:60},indent:{left:ind>3000?3000:ind},children:[new DL.TextRun({text:tx,size:sz*2,bold})]}))});
   if(!kids.length)kids.push(new DL.Paragraph(""));
  }
  secs.push({properties:pr,children:kids});prog(n/pdf.numPages)}
 const doc=new DL.Document({sections:secs});
 return[await DL.Packer.toBlob(doc),base(f.name)+".docx"]}
async function i2p(){
 let pdf;
 for(let i=0;i<files.length;i++){
  const f=files[i],url=URL.createObjectURL(f),im=new Image();
  await new Promise((ok,ko)=>{im.onload=ok;im.onerror=ko;im.src=url});
  const w=im.naturalWidth*.75,h=im.naturalHeight*.75,o=w>h?"l":"p";
  if(!pdf)pdf=new jspdf.jsPDF({unit:"pt",format:[w,h],orientation:o});else pdf.addPage([w,h],o);
  const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);
  pdf.addImage(c.toDataURL("image/jpeg",.95),"JPEG",0,0,w,h);URL.revokeObjectURL(url);prog((i+1)/files.length)}
 return[pdf.output("blob"),(files.length>1?"imagenes":base(files[0].name))+".pdf"]}
$("go").onclick=async()=>{
 $("go").disabled=true;msg("Convirtiendo… no cierres esta pantalla.");prog(0);
 try{const[b,n]=await(mode==="w2p"?w2p(files[0]):mode==="p2w"?p2w(files[0]):i2p());
  prog(null);msg("Conversión terminada. Confirma la descarga.","ok");await save(b,n)}
 catch(e){prog(null);msg("No se pudo convertir este archivo. Verifica que no esté dañado o protegido con contraseña.","er");console.error(e)}
 $("go").disabled=!files.length};
</script></main></body></html>
